[project]
name = "pricing_engine"
version = "0.1.0"
description = "Institutional-grade quantitative derivatives pricing and risk platform"
requires-python = ">=3.11"
dependencies = [
    # numpy>=2.1's bundled type stubs use PEP 695 `type` statement syntax,
    # which mypy can only parse when [tool.mypy] python_version >= 3.12.
    # This project supports Python 3.11+ (see requires-python above), so
    # numpy is capped below that stub syntax bump rather than raising
    # mypy's target and dropping 3.11 support.
    "numpy<2.1",
    "scipy",
    "pandas",
    "yfinance",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy", "ruff", "hypothesis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pricing_engine"]
# market_data.py is network-dependent (yfinance) and untestable without live
# calls or extensive mocking; plots.py is pre-existing visualization code
# migrated in Task 2. Both are tracked for coverage as a follow-up, not
# counted against the 80% gate for phase-1 core pricing/calibration logic.
omit = [
    "pricing_engine/market/market_data.py",
    "pricing_engine/visualization/plots.py",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set explicitly: ruff 0.17 widened its default selection, which
# turned a previously green `ruff check` red without any code change.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricing_engine*"]
